[project]
name = "flight-optimizer"
version = "0.1.0"
description = "Find the destination with the cheapest dollars-per-kilometer flight using Kiwi.com's Tequila API."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "haversine>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.8",
]
backend = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "django-cors-headers>=4.6",
]

[project.scripts]
flight-optimizer = "flight_optimizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = []
