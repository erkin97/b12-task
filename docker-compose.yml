services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment:
      KIWI_API_KEY: ${KIWI_API_KEY:?Set KIWI_API_KEY in your shell or in a .env file}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
